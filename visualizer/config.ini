# Settings for the visualizer.
# Format: name = value. Lines that start with # are ignored.
# If this file is missing, the app uses the values below.

# How many threads send chunks at the same time.
threads = 4

# About how long one transfer takes, in seconds. 0 = as fast as possible.
transfer_seconds = 8

# How many cells the grid has at the start (you can change it in the app).
cells = 1024

# The biggest file the app will open, in megabytes.
max_file_mb = 512

# The biggest range the "View" window shows, in bytes.
max_view_bytes = 4096

# Stable mode: the file is cut into this many equal chunks, sent almost in order.
stable_chunks = 400

# Unstable mode: about this many small chunks, sent in random order.
unstable_chunks = 3000

# Unstable mode: how many extra copies of chunks to send, in percent.
unstable_duplicates_percent = 20

# Unstable mode: how much two neighbour chunks can overlap, in percent of chunk size.
unstable_overlap_percent = 50
